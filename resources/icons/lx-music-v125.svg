<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Luminous Harmonic 应用图标 (任务栏/托盘):
    透明背景 · 无填充色块 · 圆头描边简笔双音符 · 线条圆润 (stroke-linecap/linejoin round)
    与侧栏内简笔音符 logo 同一设计语言, 主题蓝 #5b8def 保证亮暗任务栏下都清晰
  -->
  <g fill="none" stroke="#5b8def" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
    <!-- 连杆与两条符干 (端点由圆头笔帽自然收圆) -->
    <path d="M330 700 V 260 Q 330 236 354 230 L 700 152 Q 736 144 736 182 V 620" />
    <!-- 两个符头: 圆润椭圆 -->
    <ellipse cx="252" cy="712" rx="82" ry="66" transform="rotate(-14 252 712)" />
    <ellipse cx="658" cy="632" rx="82" ry="66" transform="rotate(-14 658 632)" />
  </g>
</svg>
