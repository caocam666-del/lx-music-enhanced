<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Luminous Harmonic 应用图标 (纯矢量, 任意尺寸绝对清晰)
    设计: 头戴式耳机 + 双音符
    颜色: Luminous 电子蓝渐变 (#7cb2ff → #3d7bf5)
    背景: 完全透明, 无边框无底色; 耳罩内孔真实挖空 (透明)
  -->
  <defs>
    <linearGradient id="lxblue" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7cb2ff"/>
      <stop offset="1" stop-color="#3d7bf5"/>
    </linearGradient>
    <mask id="cupHoles">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <ellipse cx="196" cy="630" rx="32" ry="86" fill="#000"/>
      <ellipse cx="828" cy="630" rx="32" ry="86" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#cupHoles)">
    <!-- ===== 头戴式耳机 ===== -->
    <path d="M 160 560 A 352 352 0 0 1 864 560"
      fill="none" stroke="url(#lxblue)" stroke-width="64" stroke-linecap="round"/>
    <path d="M 238 570 A 274 274 0 0 1 786 570"
      fill="none" stroke="url(#lxblue)" stroke-width="30" stroke-linecap="round"/>

    <rect x="116" y="486" width="160" height="292" rx="80" fill="url(#lxblue)"/>
    <rect x="748" y="486" width="160" height="292" rx="80" fill="url(#lxblue)"/>

    <!-- ===== 双音符 (居中, 符梁连接双符干顶端) ===== -->
    <g fill="url(#lxblue)">
      <!-- 符梁: 倾斜圆角粗梁, 左端对齐左符干顶, 右端略高于右符干顶 -->
      <rect x="392" y="382" width="300" height="78" rx="39" transform="rotate(-12 542 421)"/>
      <!-- 左符干 (从符梁左端下延至左符头) -->
      <rect x="400" y="430" width="58" height="290" rx="29"/>
      <!-- 右符干 (从符梁右端下延至右符头) -->
      <rect x="634" y="372" width="58" height="292" rx="29"/>
      <!-- 左符头 -->
      <ellipse cx="378" cy="726" rx="88" ry="70" transform="rotate(-16 378 726)"/>
      <!-- 右符头 -->
      <ellipse cx="612" cy="670" rx="88" ry="70" transform="rotate(-16 612 670)"/>
    </g>
  </g>
</svg>
