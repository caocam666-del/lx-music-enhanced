<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">LX Music</title>
  <desc id="desc">A luminous glass music icon with the LX Music mark and animated-wave inspiration.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="900" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173b72"/>
      <stop offset=".48" stop-color="#2563c7"/>
      <stop offset="1" stop-color="#45c99a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(230 170) rotate(45) scale(720)">
      <stop stop-color="#9cf4e0" stop-opacity=".62"/>
      <stop offset="1" stop-color="#9cf4e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="390" y1="220" x2="650" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#d5fff3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#08233e" flood-opacity=".38"/>
    </filter>
    <clipPath id="clip">
      <!-- Full bleed background avoids a light halo on Windows small icons. -->
      <rect width="1024" height="1024"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
